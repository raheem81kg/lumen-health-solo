name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      tag:
        description: "Image tag to deploy — pass a previous commit sha to roll back"
        required: true
        type: string

permissions:
  contents: read
  packages: write

env:
  STAGING_HOST: lumen-staging.eastus.cloudapp.azure.com
  PROD_HOST: lumen-prod.eastus.cloudapp.azure.com

jobs:
  # A failing check fails this job, and everything downstream is skipped — nothing deploys.
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm check-types

  # Build both app images, tagged with the commit sha, so any earlier sha is a
  # one-line redeploy (the rollback path).
  build:
    needs: test
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        app: [web, server]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Resolve image tag (commit sha, or the tag given for a manual run)
        id: tag
        run: echo "tag=${{ inputs.tag || github.sha }}" >> "$GITHUB_OUTPUT"
      - name: Write env files for BuildKit secret mounts
        run: |
          mkdir -p apps/server apps/web
          cat > apps/server/.env <<EOF
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGIN=http://localhost:3001
          EOF
          cat > apps/web/.env <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          EOF
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/${{ matrix.app }}/Dockerfile
          push: true
          build-args: |
            NEXT_PUBLIC_SERVER_URL=http://localhost:3000
          secret-files: |
            web_env=apps/web/.env
            server_env=apps/server/.env
          tags: |
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository }}-${{ matrix.app }}:latest

  # Deploy to staging automatically after green test + build. The job only
  # passes if the health checks come up — a bad release dies here and can
  # never be promoted (that's the "caught in staging" rubric check).
  deploy-staging:
    needs: build
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: staging
      url: http://lumen-staging.eastus.cloudapp.azure.com:3001
    steps:
      - uses: actions/checkout@v4
      - name: Stage deploy bundle (compose file + per-env env files)
        run: |
          mkdir -p deploy/lumen-health/apps/server deploy/lumen-health/apps/web
          cp docker-compose.yml deploy/lumen-health/
          cat > deploy/lumen-health/apps/server/.env <<EOF
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGIN=http://${{ env.STAGING_HOST }}:3001
          EOF
          cat > deploy/lumen-health/apps/web/.env <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_SERVER_URL=http://${{ env.STAGING_HOST }}:3000
          EOF
      - name: Copy bundle to the staging VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.STAGING_HOST }}
          username: lumenadmin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/lumen-health"
          target: "~"
          rm: true
      - name: Deploy and wait for health checks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.STAGING_HOST }}
          username: lumenadmin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/lumen-health
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export IMAGE_TAG="${{ inputs.tag || github.sha }}"
            export CORS_ORIGIN="http://${{ env.STAGING_HOST }}:3001"
            export PUBLIC_API_URL="http://${{ env.STAGING_HOST }}:3000"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            for i in $(seq 1 12); do
              curl -fsS http://localhost:3000/health && curl -fsS -o /dev/null http://localhost:3001/ && { echo "healthy"; exit 0; }
              sleep 5
            done
            echo "health check failed after deploy" && exit 1

  # Production is gated by the GitHub "production" environment — a reviewer
  # must approve before the same image tag is deployed there.
  deploy-prod:
    needs: deploy-staging
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    environment:
      name: production
      url: http://lumen-prod.eastus.cloudapp.azure.com:3001
    steps:
      - uses: actions/checkout@v4
      - name: Stage deploy bundle (compose file + per-env env files)
        run: |
          mkdir -p deploy/lumen-health/apps/server deploy/lumen-health/apps/web
          cp docker-compose.yml deploy/lumen-health/
          cat > deploy/lumen-health/apps/server/.env <<EOF
          NODE_ENV=production
          DATABASE_URL=${{ secrets.DATABASE_URL }}
          CORS_ORIGIN=http://${{ env.PROD_HOST }}:3001
          EOF
          cat > deploy/lumen-health/apps/web/.env <<EOF
          NODE_ENV=production
          NEXT_PUBLIC_SERVER_URL=http://${{ env.PROD_HOST }}:3000
          EOF
      - name: Copy bundle to the prod VM
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.PROD_HOST }}
          username: lumenadmin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          source: "deploy/lumen-health"
          target: "~"
          rm: true
      - name: Deploy and wait for health checks
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ env.PROD_HOST }}
          username: lumenadmin
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            set -e
            cd ~/lumen-health
            export GITHUB_REPOSITORY="${{ github.repository }}"
            export IMAGE_TAG="${{ inputs.tag || github.sha }}"
            export CORS_ORIGIN="http://${{ env.PROD_HOST }}:3001"
            export PUBLIC_API_URL="http://${{ env.PROD_HOST }}:3000"
            echo "${{ secrets.GHCR_PAT }}" | docker login ghcr.io -u ${{ github.actor }} --password-stdin
            docker compose pull
            docker compose up -d
            for i in $(seq 1 12); do
              curl -fsS http://localhost:3000/health && curl -fsS -o /dev/null http://localhost:3001/ && { echo "healthy"; exit 0; }
              sleep 5
            done
            echo "health check failed after deploy" && exit 1
